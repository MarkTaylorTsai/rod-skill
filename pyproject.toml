[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rod-skill"
version = "0.2.0"
description = "ROD Skills: Ratchet-Oriented Architecture and Goal Loop manifests and helper tools for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mark Taylor Tsai" }
]
keywords = ["ai-agent", "skill", "manifest", "rod", "software-quality", "architecture-pattern", "goal-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
rod-skill = "rod_skill.cli:main"

[project.urls]
Homepage = "https://github.com/MarkTaylorTsai/rod-skill"
Repository = "https://github.com/MarkTaylorTsai/rod-skill"
Issues = "https://github.com/MarkTaylorTsai/rod-skill/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
